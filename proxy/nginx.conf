# Прокси перед магазином, как в проде: http://localhost:8088 → shop:8080.
# Ответа он ждёт минуту (proxy_read_timeout), потом отдаёт клиенту 504.
events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://shop:8080;
            proxy_read_timeout 60s;
        }
    }
}
